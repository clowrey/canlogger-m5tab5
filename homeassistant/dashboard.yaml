# Example Home Assistant dashboard for the Tab5 CAN logger (sections view).
# Add a dashboard, open its raw configuration editor and paste this.
# Replace <tab5-ip> with the Tab5's address. Entity ids assume the device name
# "Tab5 CAN Logger" (prefix sensor.tab5_can_logger_...).
title: Tab5 CAN Logger
views:
  - title: Tab5
    path: tab5
    icon: mdi:sd
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Capture
            heading_style: title
          - type: tile
            entity: binary_sensor.tab5_can_logger_capture_valid_0_overruns
            name: Capture valid
          - type: tile
            entity: binary_sensor.tab5_can_logger_sd_ok
            name: SD card
          - type: tile
            entity: switch.tab5_can_logger_can_capture_armed
            name: Capture armed
            features:
              - type: toggle
          - type: tile
            entity: sensor.tab5_can_logger_can_frames_captured
            name: Frames
          - type: tile
            entity: sensor.tab5_can_logger_can_overruns
            name: Overruns
          - type: tile
            entity: sensor.tab5_can_logger_can_frame_rate
            name: Frame rate
          - type: tile
            entity: sensor.tab5_can_logger_can_bus_load
            name: Bus load
          - type: tile
            entity: sensor.tab5_can_logger_capture_mb_written
            name: Written
          - type: tile
            entity: sensor.tab5_can_logger_buffer_fill
            name: Buffer fill
      - type: grid
        cards:
          - type: heading
            heading: Files
            heading_style: title
          - type: tile
            entity: sensor.tab5_can_logger_current_segment
            name: Current segment
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.tab5_can_logger_segment_size
            name: Segment size
          - type: tile
            entity: sensor.tab5_can_logger_sd_free
            name: SD free
          - type: markdown
            grid_options:
              columns: 12
            content: >-
              {% set f = states('sensor.tab5_can_logger_current_segment') %}
              **[Open capture files](http://<tab5-ip>/files)** · [Device page](http://<tab5-ip>/)


              {% if f not in ['', '-', 'unknown', 'unavailable'] %}Logging to
              [{{ f }}](http://<tab5-ip>/dl?f={{ f }}) (a new segment starts every
              64 MB).{% else %}SD card not mounted.{% endif %}


              <small>Pages use the Tab5's web_server login. Large files download
              slowly over its Wi-Fi; for big captures, Safe shutdown and copy the SD
              card instead.</small>
      - type: grid
        cards:
          - type: heading
            heading: Power
            heading_style: title
          - type: tile
            entity: binary_sensor.tab5_can_logger_safe_to_power_off
            name: Safe to power off
            grid_options:
              columns: 12
          - type: button
            entity: button.tab5_can_logger_safe_shutdown_close_sd_files
            name: Safe shutdown
            icon: mdi:power
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.tab5_can_logger_safe_shutdown_close_sd_files
              confirmation:
                text: Stop capture and close the SD files? Logging resumes only after Restart.
            hold_action:
              action: more-info
          - type: button
            entity: button.tab5_can_logger_restart
            name: Restart
            icon: mdi:restart
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.tab5_can_logger_restart
              confirmation:
                text: Restart the Tab5? Logging continues in a new segment.
            hold_action:
              action: more-info
          - type: tile
            entity: sensor.tab5_can_logger_battery_level
            name: Battery
          - type: tile
            entity: sensor.tab5_can_logger_battery_voltage
            name: Battery voltage
          - type: tile
            entity: sensor.tab5_can_logger_battery_current
            name: Current (+ = discharging)
          - type: tile
            entity: sensor.tab5_can_logger_battery_power
            name: Battery power
      - type: grid
        cards:
          - type: heading
            heading: Bus
            heading_style: title
          - type: tile
            entity: sensor.tab5_can_logger_can_bus_state
            name: Controller state
          - type: tile
            entity: sensor.tab5_can_logger_can_bus_errors
            name: Bus errors
          - type: tile
            entity: sensor.tab5_can_logger_can_unique_ids
            name: Unique IDs
            grid_options:
              columns: 12
          - type: markdown
            grid_options:
              columns: 12
            content: |-
              **Busiest IDs** (frames/s, last 2 s)
              {% set t = states('sensor.tab5_can_logger_top_can_ids') %}
              {% if t in ['-', '', 'unknown', 'unavailable'] %}no traffic{% else %}
              {% for x in t.split(', ') %}
              - `{{ x }}`
              {% endfor %}{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: History
            heading_style: title
          - type: history-graph
            title: Frame rate and bus load
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - sensor.tab5_can_logger_can_frame_rate
              - sensor.tab5_can_logger_can_bus_load
          - type: history-graph
            title: Frames and data written
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - sensor.tab5_can_logger_can_frames_captured
              - sensor.tab5_can_logger_capture_mb_written
          - type: history-graph
            title: Overruns and bus errors
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - sensor.tab5_can_logger_can_overruns
              - sensor.tab5_can_logger_can_bus_errors
          - type: history-graph
            title: Buffer fill
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - sensor.tab5_can_logger_buffer_fill
      - type: grid
        cards:
          - type: heading
            heading: Storage
            heading_style: title
          - type: tile
            entity: sensor.tab5_can_logger_sd_free
            name: SD free
          - type: tile
            entity: sensor.tab5_can_logger_sd_size
            name: SD size
          - type: tile
            entity: sensor.tab5_can_logger_current_segment
            name: Current segment
          - type: tile
            entity: sensor.tab5_can_logger_segment_size
            name: Segment size
          - type: tile
            entity: sensor.tab5_can_logger_sd_slowest_sync
            name: Slowest sync
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: Device
            heading_style: title
          - type: tile
            entity: sensor.tab5_can_logger_wifi_signal
            name: Wi-Fi signal
          - type: tile
            entity: sensor.tab5_can_logger_ip_address
            name: IP address
          - type: tile
            entity: sensor.tab5_can_logger_uptime
            name: Uptime
          - type: tile
            entity: sensor.tab5_can_logger_reset_reason
            name: Last reset
          - type: tile
            entity: number.tab5_can_logger_screen_brightness
            name: Screen brightness
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: entities
            title: Hardware
            state_color: true
            show_header_toggle: false   # one tap would switch all of these, Wi-Fi included
            grid_options:
              columns: 12
            entities:
              - entity: switch.tab5_can_logger_wifi_power
                name: Wi-Fi power (off drops it from the network)
              - entity: switch.tab5_can_logger_wifi_external_antenna
                name: External Wi-Fi antenna
              - entity: switch.tab5_can_logger_external_5v_power
                name: Port A 5 V (powers the CAN unit)
              - entity: switch.tab5_can_logger_charge_enable
                name: Battery charging
      - type: grid
        cards:
          - type: heading
            heading: Diagnostics
            heading_style: title
          - type: tile
            entity: sensor.tab5_can_logger_buffer_peak
            name: Buffer peak
          - type: tile
            entity: sensor.tab5_can_logger_staging_peak
            name: Staging peak
          - type: tile
            entity: sensor.tab5_can_logger_heap_free
            name: Heap free
          - type: tile
            entity: sensor.tab5_can_logger_psram_free
            name: PSRAM free
          - type: tile
            entity: sensor.tab5_can_logger_loop_time
            name: Loop time
            grid_options:
              columns: 12
